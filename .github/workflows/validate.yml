name: APCAF Specification & Schema CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate Canonical Technique and Case Schemas
        run: |
          python3 scripts/validate_schemas.py

      - name: Verify Single Source of Truth Compilation
        run: |
          python3 scripts/build_data.py
          git diff --exit-code data/techniques.json || (echo "data/techniques.json is out of sync with techniques/*.yaml. Run scripts/build_data.py and commit." && exit 1)
