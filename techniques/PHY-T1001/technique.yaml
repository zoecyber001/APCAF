id: "PHY-T1001"
name: "Credential Technology Assessment"
status: "base_coverage"
tactic_id: "PHY-TAC-03"
tactic_name: "Credential & Access Bypass"
target_object: "BADGE"
target_time_seconds: 5

hypothesis: "Physical credentials broadcasting static, unauthenticated identifiers may permit harvest, replay, or cloning where the access-control architecture does not enforce cryptographic challenge-response mutual authentication."

assessment_condition: "Does the electronic credential broadcast a static, unencrypted identifier upon interrogation, and does the access-control architecture enforce cryptographic mutual authentication to prevent credential replay?"

assessment_procedure:
  method: "passive_rf_interrogation"
  tools_required:
    - "Pocket dual-frequency RFID/NFC interrogation tool"
  steps:
    - "Step 1 (Technology Identification): Interrogate sample credential to identify operating carrier frequency (125 kHz Low Frequency vs. 13.56 MHz High Frequency) and chip protocol standard."
    - "Step 2 (Authentication Mechanism): Determine whether the credential broadcasts a static identifier (UID/CSN) without requiring a cryptographic handshake."
    - "Step 3 (Behavioral Assessment): Distinguish static identifier broadcast from dynamic session-based cryptographic challenge-response protocols."
    - "Step 4 (Verification Boundary): Record whether reader-side cryptographic key enforcement (SAM configuration, AES mutual auth) requires administrative configuration audit."

evidence_requirements:
  data_type: "device_read"
  acceptable_formats:
    - "RFID carrier frequency & protocol capture log"
    - "Credential chip protocol and identifier broadcast profile"
  validation_criteria: "Documented carrier frequency, protocol standard, static broadcast status, and confirmation of whether reader-side cryptographic challenge-response is enforced."

result_model:
  hardened_criteria: "Credential architecture implements mutual cryptographic challenge-response authentication with verified reader-side key enforcement."
  deficient_criteria: "Credential relies on unencrypted static identifier broadcast (125 kHz Prox, EM4100, or unauthenticated 13.56 MHz CSN) susceptible to passive harvest and replay."
  condition_requires_validation_criteria: "High-frequency smartcard observed; reader-side cryptographic challenge-response, SAM configuration, and anti-downgrade policies require administrative verification."

limitations:
  can_establish:
    - "Operating carrier frequency (LF 125 kHz vs. HF 13.56 MHz)."
    - "Exposure of static unencrypted credential identifiers on tested badge."
  cannot_establish:
    - "Reader-side cryptographic key enforcement or SAM validation without administrative configuration evidence."
    - "Whether secondary compensating factors (such as biometric verification or PACs duress monitoring) are enforced at readers."

mitigation_id: "PHY-M1001"
mitigation_name: "Cryptographic Smartcard Migration"
mitigation_action: "Upgrade credential stock to ISO/IEC 14443-4 smartcards with AES-128 mutual authentication (DESFire EV3 / Seos) and activate SAM keys on access readers."

technical_references:
  - standard: "ISO/IEC 14443-4"
    section: "Transmission Protocol"
    title: "Identification cards - Contactless integrated circuit cards"
  - standard: "NIST SP 800-116 Rev 1"
    section: "Section 4.1"
    title: "Guidelines for the Use of PIV Credentials in Facility Access"

framework_mappings:
  - framework: "ISO/IEC 27001:2022"
    control_id: "A.7.2"
    title: "Physical entry controls"
  - framework: "PCI DSS v4.0"
    control_id: "Req 9.2.1"
    title: "Physical access control to sensitive areas"
