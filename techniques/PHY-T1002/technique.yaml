id: "PHY-T1002"
name: "Door & Latch Protection Assessment"
status: "base_coverage"
tactic_id: "PHY-TAC-02"
tactic_name: "Perimeter & Ingress"
target_object: "DOOR"
target_time_seconds: 15

hypothesis: "Door and frame geometry may permit mechanical manipulation of the latch bolt assembly where protective physical shielding is absent and strike clearances exceed engineering tolerances."

assessment_condition: "Does the outward-opening door assembly exhibit strike margin clearance exceeding the applicable assembly requirement (or engineering tolerance) with direct line-of-sight to the latch bolt and zero overlapping protective steel astragal guard?"

assessment_procedure:
  method: "visual_and_feeler_gauge"
  tools_required:
    - "Feeler gap gauge / caliper"
    - "Flashlight"
  steps:
    - "Inspect door swing direction (inward vs. outward opening)."
    - "Measure frame strike gap at latch level using feeler gauge."
    - "Compare measured strike clearance against applicable architectural assembly specifications or edition-specific standards (e.g., NFPA 80 / ANSI SDI where applicable)."
    - "Check for presence and full coverage of continuous stainless steel security astragal plate."

evidence_requirements:
  data_type: "measurement"
  acceptable_formats:
    - "Measured gap dimension in millimeters (mm)"
    - "Photo of frame margin with gauge"
  validation_criteria: "Documented strike clearance dimension compared against the governing architectural or fire-rated assembly specification."

result_model:
  hardened_criteria: "Outward door fitted with continuous full-height steel astragal overlapping jamb; latch bolt fully shielded from direct mechanical access."
  deficient_criteria: "Exposed latch bolt with perimeter strike clearance exceeding the applicable assembly tolerance and zero exterior protective astragal plate."
  condition_requires_validation_criteria: "Perimeter gap exceeds standard tolerance on non-rated assembly where deadlocking auxiliary latch engagement requires physical verification."

limitations:
  can_establish:
    - "Exact perimeter gap measurements against fire and building standards."
    - "Presence and structural alignment of protective astragal shielding."
  cannot_establish:
    - "Internal lock cylinder integrity or mechanical deadbolt throw status without operational key/credential testing."

mitigation_id: "PHY-M1002"
mitigation_name: "Continuous Security Astragal Installation"
mitigation_action: "Install full-height continuous stainless steel security astragal plate overlapping the door frame stop on the exterior approach side."

technical_references:
  - standard: "NFPA 80"
    section: "§6.3.1.7.1"
    title: "Standard for Fire Doors and Other Opening Protectives"
  - standard: "ANSI/SDI A250.8"
    section: "Section 2.1.8"
    title: "Specifications for Standard Steel Doors and Frames"

framework_mappings:
  - framework: "ISO/IEC 27001:2022"
    control_id: "A.7.1"
    title: "Physical security perimeters"
  - framework: "PCI DSS v4.0"
    control_id: "Req 9.1.1"
    title: "Physical access controls for sensitive areas"
